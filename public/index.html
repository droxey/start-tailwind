<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
    />
    <title>Example site</title>
    <meta
      name="description"
      content="A static site built with HTML, Tailwind CSS, and vanilla JavaScript."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="canonical" href="https://droxey.com/start-tailwind/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Example site" />
    <meta
      property="og:description"
      content="A static site built with HTML, Tailwind CSS, and vanilla JavaScript."
    />
    <meta property="og:url" content="https://droxey.com/start-tailwind/" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/site.css" />
    <script type="module" src="js/main.js"></script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://droxey.com/start-tailwind/#website",
            "name": "Example site",
            "url": "https://droxey.com/start-tailwind/",
            "inLanguage": "en",
            "publisher": { "@id": "https://droxey.com/start-tailwind/#author" }
          },
          {
            "@type": "WebPage",
            "@id": "https://droxey.com/start-tailwind/#webpage",
            "url": "https://droxey.com/start-tailwind/",
            "name": "Example site",
            "description": "A static site built with HTML, Tailwind CSS, and vanilla JavaScript.",
            "inLanguage": "en",
            "isPartOf": { "@id": "https://droxey.com/start-tailwind/#website" },
            "author": { "@id": "https://droxey.com/start-tailwind/#author" }
          },
          {
            "@type": "Person",
            "@id": "https://droxey.com/start-tailwind/#author",
            "name": "Dani Roxberry",
            "alternateName": "@droxey",
            "url": "https://github.com/droxey",
            "sameAs": ["https://github.com/droxey"]
          }
        ]
      }
    </script>
  </head>
  <body class="bg-surface font-sans text-step-0 text-ink antialiased">
    <a
      href="#main"
      class="sr-only focus:not-sr-only focus:fixed focus:inset-s-fluid-s focus:inset-bs-fluid-s focus:z-50 focus:rounded-sm focus:bg-accent focus:px-4 focus:py-2 focus:text-accent-ink"
      >Skip to content</a
    >
    <header class="border-be border-ink/10">
      <nav aria-label="Primary" class="mx-auto px-fluid-s-l py-fluid-xs max-inline-7xl">
        <ul class="flex flex-wrap items-center gap-fluid-s">
          <li>
            <a href="./" aria-current="page" class="underline-offset-4 hover:underline">Home</a>
          </li>
          <li class="ms-auto">
            <button
              type="button"
              data-theme-toggle
              class="rounded-md border border-ink/20 px-fluid-s min-block-11 min-inline-11 motion-safe:transition-colors forced-colors:border-[ButtonBorder]"
              aria-pressed="false"
            >
              Dark mode
            </button>
          </li>
        </ul>
      </nav>
    </header>
    <main id="main" class="mx-auto px-fluid-s-l py-fluid-m-xl max-inline-7xl">
      <h1 class="text-step-4 font-bold text-balance">Hello</h1>
      <p class="mbs-fluid-s max-w-prose text-ink-muted">Static, accessible, fast.</p>
      <div class="@container mbs-fluid-l">
        <ul class="grid gap-fluid-s @md:grid-cols-2 @3xl:grid-cols-3">
          <li class="rounded-lg bg-surface-raised p-fluid-s">
            <h2 class="text-step-1 font-semibold">Fluid</h2>
            <p>Every width from 320px to ultra-wide.</p>
          </li>
          <li class="rounded-lg bg-surface-raised p-fluid-s">
            <h2 class="text-step-1 font-semibold">Accessible</h2>
            <p>WCAG 2.2 AA as the floor.</p>
          </li>
          <li class="rounded-lg bg-surface-raised p-fluid-s">
            <h2 class="text-step-1 font-semibold">Readable by agents</h2>
            <p>Semantic HTML and a clean accessibility tree.</p>
          </li>
        </ul>
      </div>
    </main>
    <footer class="mx-auto px-fluid-s-l py-fluid-m max-inline-7xl">
      <p>
        <small
          >written with <span aria-hidden="true">&hearts;</span><span class="sr-only">love</span> by
          <a
            href="https://github.com/droxey"
            title="@droxey on github"
            class="font-bold text-accent underline underline-offset-4 hover:decoration-2 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-focus"
            >@droxey</a
          ></small
        >
      </p>
    </footer>
  </body>
</html>
