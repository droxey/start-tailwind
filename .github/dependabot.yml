# Version updates for GitHub Actions only (gate Q7 B). npm, the Tailwind binary, and the vendored
# skills are checked by the weekly upgrade routine instead. Security updates stay enabled in repo
# settings.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
