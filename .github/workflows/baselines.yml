# Regenerates the Playwright screenshot baselines on the CI runner, so fonts match the Quality job.
# Run it from the Actions tab (or `gh workflow run baselines.yml --ref <branch>`), download the
# "baselines" artifact, review the images, and commit them yourself. Never commit baselines
# rendered on another machine.
name: Update visual baselines
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baselines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sh scripts/get-tailwind.sh && npm run build:css
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/responsive.spec.js --update-snapshots=all
        env:
          PW_CHANNEL: chromium
      - uses: actions/upload-artifact@v7
        with:
          name: baselines
          path: tests/responsive.spec.js-snapshots/
