# Self-hosted static site (nginx). HTTPS via certbot or your TLS terminator.
server {
  listen 80;
  listen [::]:80;
  server_name example.com www.example.com;
  return 301 https://example.com$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name example.com;
  # ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

  root /var/www/example.com/public;
  index index.html;
  charset utf-8;

  # Clean URLs: /about -> about.html; redirect explicit .html to the clean URL.
  if ($request_uri ~ ^/(.*/)?index(\.html)?(\?|$)) { return 301 /$1$is_args$args; }
  if ($request_uri ~ ^/(.*)\.html(\?|$)) { return 301 /$1$is_args$args; }
  location / {
    try_files $uri $uri.html $uri/ =404;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Redirects
  location = /old-page { return 301 /new-page; }

  error_page 404 /404.html;
  location = /404.html { internal; }

  # Fingerprint or version files in /assets/ before using immutable caching.
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; include /etc/nginx/snippets/security-headers.conf; }

  include /etc/nginx/snippets/security-headers.conf;
  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json text/plain;
}

# /etc/nginx/snippets/security-headers.conf (nginx drops parent add_header lines when a
# location adds its own, so every location that sets headers includes this file):
# add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
